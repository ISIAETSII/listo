# Integración continua: en cada push o pull request se instala el proyecto,
# se pasa el linter (ruff) y se ejecutan los tests (pytest).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Linter
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      - name: Tests
        run: pytest

      - name : Versiones
        run: pip list



