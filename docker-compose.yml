# Entorno de desarrollo con Docker: la aplicación Flask (web) + MariaDB (db).
#
#   docker compose up --build   → construye y arranca todo (http://localhost:5000)
#   docker compose down         → para los contenedores
#   docker compose down -v      → para los contenedores y borra la base de datos
#
# Los valores ${VARIABLE:-defecto} se leen del fichero .env si existe. Dentro del contenedor
# mandan las variables de este fichero (el .env montado no las sobrescribe).

name: listo

services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-listo_db}
      MARIADB_USER: ${MARIADB_USER:-listo_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-listo_password}
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306" # solo accesible desde esta máquina
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:-clave-de-desarrollo-cambiame}
      MARIADB_HOSTNAME: db # dentro de la red de Docker, el host es el nombre del servicio
      MARIADB_PORT: 3306
      MARIADB_DATABASE: ${MARIADB_DATABASE:-listo_db}
      MARIADB_USER: ${MARIADB_USER:-listo_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-listo_password}
      DATABASE_URL: "" # vacío a propósito: un DATABASE_URL del fichero .env no debe sustituir a MariaDB
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:5000"
    volumes:
      - .:/app # el código se monta en el contenedor: los cambios se ven sin reconstruir
    depends_on:
      db:
        condition: service_healthy # espera a que MariaDB esté lista
    command: sh -c "flask init-db && flask seed-db && flask run --host=0.0.0.0"

volumes:
  mariadb_data:
